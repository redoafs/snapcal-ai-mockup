# ===== SnapCal AI - konfigurasi Netlify =====
# Netlify mendeteksi Next.js otomatis dan memakai "Next.js runtime" bawaan,
# jadi TIDAK perlu plugin @netlify/plugin-nextjs lagi (versi lama bisa membuat
# routing rusak di Next.js 15 -> 404). Jangan set publish directory secara
# manual; biarkan runtime yang mengaturnya.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# ===== Environment variables WAJIB (isi di Netlify sebelum deploy) =====
# Nilai NEXT_PUBLIC_* dikunci saat BUILD, jadi isi dulu:
#   NEXT_PUBLIC_SUPABASE_URL    -> https://tahnkykyvfshcglwbzui.supabase.co
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   NEXT_PUBLIC_LYNK_URL
# Panduan: docs/PANDUAN_DEPLOY_NETLIFY.md