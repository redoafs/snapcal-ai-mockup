# ===== SnapCal AI - konfigurasi Netlify =====
# Deploy lewat "Import from GitHub": Netlify mendeteksi Next.js, plugin
# berikut menangani runtime & publish directory (jangan set publish sendiri).

[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# ===== Environment variables WAJIB (isi di Netlify sebelum deploy) =====
# Nilai NEXT_PUBLIC_* dikunci saat BUILD, jadi isi dulu:
#   NEXT_PUBLIC_SUPABASE_URL    -> https://tahnkykyvfshcglwbzui.supabase.co
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   NEXT_PUBLIC_LYNK_URL
